<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OFI GESTION · Prueba API</title><style>body{font-family:system-ui,Arial;padding:32px;background:#f5f7fb;color:#182230}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:24px}button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:700}pre{white-space:pre-wrap;background:#f9fafb;padding:14px;border-radius:8px}</style></head><body><div class="box"><h1>OFI GESTION · Prueba de conexión</h1><p>Esta página comprueba desde GitHub Pages que la aplicación puede leer y escribir en Google Sheets mediante Apps Script.</p><button id="test">Probar lectura</button><pre id="out">Listo para probar.</pre></div><script>const API='https://script.google.com/macros/s/AKfycbzTUBdjJMgA0F_txKpNR_b4__F1LT_vb9LRURLvJ_n3tTMs3AFTRllWgLky5gdbV6QV/exec';document.getElementById('test').onclick=async()=>{const out=document.getElementById('out');out.textContent='Conectando...';try{const r=await fetch(API+'?action=list');const t=await r.text();out.textContent='HTTP '+r.status+'\n'+t}catch(e){out.textContent='ERROR\n'+e.message}};</script></body></html>
